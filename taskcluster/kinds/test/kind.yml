---
loader: taskgraph.loader.transform:loader

transforms:
    - balrog_taskgraph.transforms.tox:transforms
    - taskgraph.transforms.run:transforms
    - taskgraph.transforms.task:transforms

task-defaults:
        run-on-tasks-for:
            - github-pull-request
            - github-pull-request-untrusted
            - github-push
        attributes:
            code-review: true
        worker-type: test
        worker:
            docker-image: {in-tree: 'python3.13'}
            max-run-time: 1200
        run:
            using: run-task
            checkout:
                balrog: {}
            command: ['uv', 'run', '--locked', 'tox']

tasks:
    backend:
        description: balrog backend tests
        # coveralls reporting is layered on by the tox transform when the
        # secret is available (i.e. not on untrusted pull requests).
        coveralls: true
        run:
            cwd: '{checkout}'
            command: 'uv run --locked tox'
        worker:
            env:
                TOXENV: 'py313'

    lint-backend:
      description: balrog backend lints
      run:
          cwd: '{checkout}'
      worker:
          env:
              TOXENV: 'check'

    agent:
        description: balrog agent tests
        run:
            cwd: '{checkout}/agent'
        worker:
            env:
                TOXENV: 'py313'

    lint-agent:
      description: balrog agent lints
      run:
          cwd: '{checkout}/agent'
      worker:
          env:
              TOXENV: 'check'

    client:
        description: balrog client tests
        run:
            cwd: '{checkout}/client'
        worker:
            docker-image: {in-tree: 'python3.11'}
            env:
                TOXENV: 'py311'

    lint-client:
      description: balrog client lints
      run:
          cwd: '{checkout}/client'
      worker:
          env:
              TOXENV: 'check'

    client-py313:
        description: balrog client tests (python 3.13)
        run:
            cwd: '{checkout}/client'
        worker:
            env:
                TOXENV: 'py313'
